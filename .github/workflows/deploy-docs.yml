name: Deploy docs

# Manual docs deploy (Actions → Deploy docs → Run workflow). `pnpm docs:build`
# is the vp task `:docs:build`, whose graph pulls in everything the vitepress
# build needs — `:docs:gen` (which depends on `:api` and `:size`) plus the
# docs deps' `:build:*` legs — so this workflow runs no build/generation steps
# of its own. The cached legs replay from the restored vp task cache (the
# docs tasks themselves are deliberately uncached); the cache is keyed per
# commit with a prefix fallback, and vp revalidates inputs on a stale hit.
# Then each selected adapter's site deploys to its Cloudflare Worker via
# wrangler (config in wrangler.jsonc: env `ui` → vueform-ui-docs, env
# `primevue` → vueform-primevue-docs). Needs the CLOUDFLARE_API_TOKEN
# (Workers Scripts:Edit) and CLOUDFLARE_ACCOUNT_ID repo secrets.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which docs to deploy
        type: choice
        options: [all, ui, primevue]
        default: all

concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy (${{ inputs.target }})
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version read from packageManager

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore vp task cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite/task-cache
            packages/*/dist
            .vueform/api
            .vueform/size
          key: vp-tasks-docs-${{ github.sha }}
          restore-keys: vp-tasks-docs-

      # Adapter flags pass through vpr to the docs runner; the task's deps
      # (gen, api, size, package builds) run or replay as needed.
      - name: Build docs
        run: pnpm docs:build ${{ inputs.target == 'all' && '--ui --primevue' || format('--{0}', inputs.target) }}

      - name: Deploy ui docs
        if: contains(fromJSON('["all","ui"]'), inputs.target)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ui

      - name: Deploy primevue docs
        if: contains(fromJSON('["all","primevue"]'), inputs.target)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env primevue
