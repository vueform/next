name: Release

# Release pipeline (Actions → Release → Run workflow). Gates run before
# anything is versioned or published, with the same parallelism as task.yml:
# the `build` job warms the vp task cache once and shares it run-scoped
# (keyed on the run id, so re-runs restore it), then every selected gate runs
# as its own matrix job whose `pnpm build` replays from cache in seconds.
# Each gate except `build` has its own skip checkbox — `test`/`test-dts` and
# `test-smoke`/`test-smoke-types` each share one (workflow_dispatch allows at
# most 10 inputs; the pairs always travel together anyway). The `registry`,
# `size` and `bench` checkboxes also skip the release script's own regen of
# those artifacts (bench exists only there), so a skipped generator is
# skipped everywhere in the run. The
# `registry` and `size` generators' regenerated git-tracked artifacts
# (adapter registries, the packages' size.json files, README size sections)
# are uploaded per job and committed +
# pushed once by the `commit` job BEFORE the release, so the release commit's
# own regen (scripts/release.ts re-runs registry/size/bench at the stamped
# version) ships no surprise diffs. The `release` job then checks out the
# branch tip (including that regen commit), versions, commits and tags via
# `pnpm release` (a rehearsal produces the same regen + changelog + release
# commit and later a DRAFT GitHub release, just never a git tag), and pushes
# the version commit + tag BEFORE anything reaches npm. Publishing is the separate `publish` job on purpose: npm can fail
# halfway through the 9 packages, and recursive `pnpm publish` skips versions
# already in the registry, so the in-step retries — and, failing those,
# "Re-run failed jobs" on `publish` alone — finish the remaining packages
# idempotently. NEVER re-run the `release` job after its push succeeded: it
# would compute the NEXT version on top of the fresh tag and double-release;
# re-run `publish`, or dispatch a fresh run if `release` failed before
# pushing. A dry run still runs the selected gates but commits and publishes
# nothing. A failed gate can be retried with "Re-run failed jobs" — the
# run-scoped cache and the downstream jobs pick up from there.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = from conventional commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      prerelease:
        description: Channel (rehearsal = publish-only test run; none = stable on `latest`)
        type: choice
        options: [rehearsal]
        # options: [rehearsal, alpha, beta, rc, none]
        default: rehearsal
      dry_run:
        description: Dry-run (compute and print everything, publish nothing)
        type: boolean
        default: false
      skip_check:
        description: Skip check
        type: boolean
        default: false
      skip_test:
        description: Skip tests
        type: boolean
        default: false
      skip_test_smoke:
        description: Skip smoke tests
        type: boolean
        default: false
      skip_test_visual:
        description: Skip visual tests
        type: boolean
        default: false
      skip_registry:
        description: Skip registry
        type: boolean
        default: false
      skip_size:
        description: Skip size
        type: boolean
        default: false
      skip_bench:
        description: Skip bench
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read # the `commit` and `release` jobs alone escalate

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-26.04
    outputs:
      gates: ${{ steps.plan.outputs.gates }}
    steps:
      - id: plan
        env:
          # task=skipped pairs; order here is only cosmetic — gates run in
          # parallel.
          SKIPS: >-
            check=${{ inputs.skip_check }}
            test=${{ inputs.skip_test }}
            test-dts=${{ inputs.skip_test }}
            test-smoke=${{ inputs.skip_test_smoke }}
            test-smoke-types=${{ inputs.skip_test_smoke }}
            test-visual=${{ inputs.skip_test_visual }}
            registry=${{ inputs.skip_registry }}
            size=${{ inputs.skip_size }}
        run: |
          gates=()
          for pair in $SKIPS; do
            [ "${pair#*=}" = "true" ] || gates+=("${pair%%=*}")
          done
          if [ ${#gates[@]} -eq 0 ]; then
            echo 'gates=[]' >> "$GITHUB_OUTPUT"
          else
            echo "gates=$(printf '%s\n' "${gates[@]}" | jq -R '{task: .}' | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Warm build cache
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version read from packageManager

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache vp tasks (run-scoped)
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite/task-cache
            packages/*/dist
          key: vp-tasks-${{ github.run_id }}

      # Root runners import @vueform/utils' dist — build it before any runs.
      - run: pnpm exec vpr :build:utils

      - run: pnpm build

  gate:
    name: ${{ matrix.task }}
    needs: [plan, build]
    if: needs.plan.outputs.gates != '[]'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.gates) }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore vp tasks
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules/.vite/task-cache
            packages/*/dist
          key: vp-tasks-${{ github.run_id }}

      - name: Cache Playwright browsers
        if: contains(fromJSON('["test-smoke","test-visual"]'), matrix.task)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # playwright is not a root dependency — run its CLI from a package that
      # has it (the browser install itself is machine-wide).
      - name: Install Playwright chromium
        if: contains(fromJSON('["test-smoke","test-visual"]'), matrix.task)
        run: pnpm --filter @vueform/ui exec playwright install --with-deps chromium

      # Root runners import @vueform/utils' dist — build it before any runs.
      - run: pnpm exec vpr :build:utils

      # A replay of the warmed cache (seconds); gates and generators consume
      # the materialized dists.
      - name: Build workspace
        run: pnpm build

      # No baseline bootstrapping here: a release gate compares strictly, so
      # missing `-linux` baselines fail — create them via the Task or Visual
      # baselines workflow first.
      - name: Run ${{ matrix.task }}
        run: pnpm "${{ matrix.task }}"

      # Gate jobs never push: the generators upload their regenerated files
      # and the single `commit` job below commits them at once, before the
      # release. Keep the path list in sync with the `commit` job's copy.
      - name: Collect regenerated artifacts
        if: contains(fromJSON('["registry","size"]'), matrix.task)
        run: |
          set -o pipefail
          paths=(
            'packages/*/registry/*'
            'packages/*/size.json'
            'packages/*/README.md'
            'README.md'
          )
          for p in "${paths[@]}"; do
            git add -A -- "$p" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo 'No regenerated artifacts.'
            exit 0
          fi
          # Whole-file last-writer-wins in the commit job keeps overlapping
          # outputs conflict-free (both generators derive from the same
          # sources).
          mkdir -p "$RUNNER_TEMP/regen"
          git diff --cached --name-only --diff-filter=d -z \
            | tar --null --files-from=- -czf "$RUNNER_TEMP/regen/files.tgz"
          git diff --cached --name-only --diff-filter=D > "$RUNNER_TEMP/regen/deleted.txt"

      - name: Upload regenerated artifacts
        if: contains(fromJSON('["registry","size"]'), matrix.task)
        uses: actions/upload-artifact@v4
        with:
          name: regen-${{ matrix.task }}
          path: ${{ runner.temp }}/regen
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true # "Re-run failed jobs" may re-upload

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.task }}
          path: .vueform/*/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  # The sole pre-release pusher: collects the generators' regenerated files
  # and commits them in one go, so the release starts from a branch tip whose
  # artifacts are already current. Runs only when every gate passed (a
  # release must not ship on red) and never on a dry run.
  commit:
    name: Commit regenerated artifacts
    needs: gate
    if: ${{ !cancelled() && needs.gate.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # A pattern with zero matches is not an error — a run whose generators
      # regenerated nothing (or were skipped) just commits nothing below.
      - uses: actions/download-artifact@v4
        with:
          pattern: regen-*
          path: ${{ runner.temp }}/regen

      - name: Commit regenerated artifacts
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          for d in "$RUNNER_TEMP"/regen/*/; do
            if [ -f "$d/files.tgz" ]; then
              tar -xzf "$d/files.tgz"
            fi
            if [ -s "$d/deleted.txt" ]; then
              while IFS= read -r f; do
                rm -f -- "$f"
              done < "$d/deleted.txt"
            fi
          done
          # Keep this list in sync with the gate job's copy.
          paths=(
            'packages/*/registry/*'
            'packages/*/size.json'
            'packages/*/README.md'
            'README.md'
          )
          for p in "${paths[@]}"; do
            git add -A -- "$p" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo 'No regenerated artifacts to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'chore(ci): regenerate artifacts (registry size)'
          # The `release` concurrency group serializes release runs, so a
          # rejected push means an outside commit landed mid-run — the gates
          # no longer vouch for the tip. Fail loudly instead of releasing
          # from a moved branch; dispatch a fresh run.
          git push origin "HEAD:$BRANCH" || {
            echo '::error::The branch moved mid-run; the gate results are stale. Dispatch a fresh release.'
            exit 1
          }

  release:
    name: Version, commit & tag
    needs: [build, gate, commit]
    # `gate` is skipped when every checkbox is ticked and `commit` on a dry
    # run — both still allow releasing; any failure does not.
    if: >-
      ${{ !cancelled() &&
          needs.build.result == 'success' &&
          contains(fromJSON('["success","skipped"]'), needs.gate.result) &&
          contains(fromJSON('["success","skipped"]'), needs.commit.result) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write # version commit + tag push
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      rehearsal: ${{ steps.release.outputs.rehearsal }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The branch TIP, not the dispatched SHA — the `commit` job may
          # have pushed regenerated artifacts above. Full history for the
          # changelog and version bump.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore vp tasks
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules/.vite/task-cache
            packages/*/dist
          key: vp-tasks-${{ github.run_id }}

      # Root runners import @vueform/utils' dist — build it before any runs.
      - run: pnpm exec vpr :build:utils

      - run: pnpm build

      - name: Git identity (release commit + tag)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The script also rebuilds with the stamped version and regenerates
      # registries, size sections and benchmarks into the release commit
      # (every channel; rehearsals just never tag).
      - name: Compute version, rebuild, regen artifacts, commit & tag
        id: release
        env:
          # The skip checkboxes carry into the script's regen, so a skipped
          # generator is skipped everywhere in the run (bench only exists
          # here — it is not a gate).
          SKIP: "${{ inputs.skip_registry && 'registry,' || '' }}${{ inputs.skip_size && 'size,' || '' }}${{ inputs.skip_bench && 'bench' || '' }}"
        run: >
          pnpm release
          --bump ${{ inputs.bump }}
          --pre ${{ inputs.prerelease }}
          --skip "$SKIP"
          ${{ inputs.dry_run && '--dry' || '' }}

      - name: Job summary
        run: |
          {
            echo "### Release ${{ inputs.dry_run && '(dry run)' || '' }}"
            echo "- version: \`${{ steps.release.outputs.version }}\`"
            echo "- dist-tag: \`${{ steps.release.outputs.dist_tag }}\`"
            echo "- rehearsal: \`${{ steps.release.outputs.rehearsal }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        if: always()

      # What the `publish` job needs beyond git: the version-stamped
      # manifests (identical to the tag's for a real release, the ONLY copy
      # for a rehearsal, which deliberately commits nothing) and the release
      # notes (.vueform/ is git-ignored, so they only travel as an artifact).
      # Tarred so the artifact keeps repo-root-relative paths regardless of
      # which files exist.
      - name: Collect release meta
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p "$RUNNER_TEMP/meta"
          files=(packages/*/package.json)
          [ -f .vueform/release-notes.md ] && files+=(.vueform/release-notes.md)
          tar -czf "$RUNNER_TEMP/meta/meta.tgz" "${files[@]}"

      - name: Upload release meta
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: ${{ runner.temp }}/meta
          retention-days: 7
          overwrite: true

      # Versions reach git BEFORE npm: once this push lands, the tag (or the
      # tagless rehearsal release commit) is the durable record the `publish`
      # job (and any of its re-runs) works from. This is deliberately the
      # last step — if anything above failed, the repo is untouched and a
      # fresh dispatch is safe.
      - name: Push version commit and tag
        if: ${{ !inputs.dry_run }}
        run: git push --follow-tags origin HEAD:main

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-release
          path: .vueform/*/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Publishing is isolated and idempotent: every pass skips packages already
  # VISIBLE at the release version and publishes the rest one by one, so a
  # single rejection (typically a package without npm trusted-publisher
  # access for this workflow) cannot block the others the way a recursive
  # publish does. The registry stages publishes asynchronously: an attempt
  # that dies mid-processing leaves the version "staged" — invisible to
  # `npm view` yet rejecting re-PUTs with E409 "previously staged version" —
  # until it is promoted on its own, which is what the pauses between passes
  # wait out. When passes run out, "Re-run failed jobs" on THIS job continues
  # where things stopped: the version commit and tag are already pushed, so a
  # re-run reconstructs the exact release state from the tag (or from the
  # uploaded manifests for a rehearsal, which tags nothing).
  publish:
    name: Publish
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && !inputs.dry_run }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v5
        with:
          # Publish exactly what was tagged; a rehearsal has no tag, so it
          # publishes the dispatched SHA plus the uploaded manifests.
          ref: ${{ needs.release.outputs.rehearsal == 'true' && github.sha || format('v{0}', needs.release.outputs.version) }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore vp tasks
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules/.vite/task-cache
            packages/*/dist
          key: vp-tasks-${{ github.run_id }}

      - uses: actions/download-artifact@v4
        with:
          name: release-meta
          path: ${{ runner.temp }}/meta

      - name: Apply release meta
        run: tar -xzf "$RUNNER_TEMP/meta/meta.tgz"

      # Dist banners stamp the version from the manifests at build time.
      # Root runners import @vueform/utils' dist — build it before any runs.
      - run: pnpm exec vpr :build:utils

      - run: pnpm build

      - name: Publish to npm (trusted publishing + provenance)
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          DIST_TAG: ${{ needs.release.outputs.dist_tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # One pass publishes every public package not yet visible at
          # $VERSION, each on its own. A version the registry is still
          # staging fails its re-PUT with E409 here but goes visible by a
          # later pass, hence the sleep between passes.
          pass() {
            FAILED=()
            local dir private pkg
            for dir in packages/*/; do
              private=$(node -p "require('./$dir/package.json').private ?? false")
              if [ "$private" = "true" ]; then
                continue
              fi
              pkg=$(node -p "require('./$dir/package.json').name")
              if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
                echo "visible:   $pkg@$VERSION"
                continue
              fi
              if pnpm --filter "$pkg" publish --tag "$DIST_TAG" --no-git-checks; then
                echo "published: $pkg@$VERSION"
              else
                echo "failed:    $pkg"
                FAILED+=("$pkg")
              fi
            done
          }
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              echo "Waiting for staged publishes to settle before pass $attempt..."
              sleep 60
            fi
            pass
            if [ "${#FAILED[@]}" -eq 0 ]; then
              exit 0
            fi
            echo "Pass $attempt left unpublished: ${FAILED[*]}"
          done
          echo "::error::Still unpublished after 5 passes: ${FAILED[*]}. A package failing every pass usually has no npm trusted publisher configured for this workflow — fix that, then re-run THIS job (never the release job); visible versions are skipped."
          exit 1

      - name: Assert dist-tags (prerelease must never ride `latest`)
        if: ${{ inputs.prerelease != 'none' }}
        run: |
          version='${{ needs.release.outputs.version }}'
          failed=0
          for dir in packages/*/; do
            pkg=$(node -p "require('./$dir/package.json').name")
            latest=$(npm dist-tag ls "$pkg" | awk -F': ' '$1=="latest"{print $2}')
            echo "$pkg latest=$latest"
            if [ "$latest" = "$version" ]; then
              echo "::error::$pkg latest points at the just-published prerelease $version"
              failed=1
            fi
          done
          exit $failed

      # A rehearsal gets a DRAFT release: gh only creates the git tag when a
      # draft is published, so this exercises the notes + release path
      # without minting a v2.0.0-0.N tag that would seed real version math.
      # The list lookup (drafts included) keeps re-runs idempotent.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          REHEARSAL: ${{ needs.release.outputs.rehearsal }}
        run: |
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qx "v$VERSION"; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          draft_flag=''
          if [ "$REHEARSAL" = "true" ]; then
            draft_flag='--draft'
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file .vueform/release-notes.md \
            ${{ inputs.prerelease != 'none' && '--prerelease' || '' }} \
            $draft_flag

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-publish
          path: .vueform/*/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
