name: Task

# On-demand task runs (Actions → Task → Run workflow): one or more root gates
# or generators, space- or comma-separated (`check test`, `registry,size`),
# executed sequentially on one runner so they share the install and the
# vp-cached build. Regenerated git-tracked artifacts (visual baselines,
# benchmark results, adapter registries, README size sections, docs content)
# are committed back to the dispatched branch. Visual baselines: the first
# `test-visual` run on a runner OS has no `-linux` baselines, so it writes and
# commits them (next to the darwin ones, platform-suffixed) and later runs
# compare strictly; re-baseline deliberately with the `update_baselines`
# input.

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: >-
          Tasks: build check test test-dts test-smoke test-smoke-types
          test-visual registry size bench api docs:gen docs:build
        type: string
        required: true
        default: check
      update_baselines:
        description: 'test-visual: regenerate ALL baselines for this OS and commit them'
        type: boolean
        default: false

concurrency:
  group: task-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # the regenerated-artifacts commit

jobs:
  task:
    name: ${{ inputs.tasks }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `test-smoke-types` matches the `test-smoke` substring; the extra
      # browser install it gets is harmless.
      - name: Cache Playwright browsers
        if: contains(inputs.tasks, 'test-smoke') || contains(inputs.tasks, 'test-visual') || contains(inputs.tasks, 'bench')
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        if: contains(inputs.tasks, 'test-smoke') || contains(inputs.tasks, 'test-visual') || contains(inputs.tasks, 'bench')
        run: pnpm exec playwright install --with-deps chromium

      # Gates and generators consume package dists; the build is vp-cached, so
      # this is the honest cold-start cost once per runner.
      - name: Build workspace
        if: inputs.tasks != 'build'
        run: pnpm build

      # No `-linux` baselines committed yet → this run bootstraps and commits
      # them.
      - name: Detect missing Linux baselines
        id: baselines
        if: contains(inputs.tasks, 'test-visual')
        run: |
          if find packages/*/tests/visual/screenshots -name '*-linux*' 2>/dev/null | grep -q .; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tasks
        env:
          TASKS: ${{ inputs.tasks }}
          UPDATE_BASELINES: ${{ (inputs.update_baselines || steps.baselines.outputs.missing == 'true') && 'true' || 'false' }}
        run: |
          set -e
          for task in ${TASKS//,/ }; do
            echo "::group::$task"
            case "$task" in
              test-visual)
                if [ "$UPDATE_BASELINES" = "true" ]; then
                  pnpm test-visual --update-snapshots
                else
                  pnpm test-visual
                fi
                ;;
              *)
                pnpm "$task"
                ;;
            esac
            echo "::endgroup::"
          done

      - name: Commit regenerated artifacts
        run: |
          git add -A -- \
            'packages/*/tests/visual/screenshots' \
            'packages/*/registry' \
            'packages/*/README.md' \
            'README.md' \
            'benchmark/results' \
            'docs/src'
          if git diff --cached --quiet; then
            echo 'No regenerated artifacts to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'chore(ci): regenerate artifacts (${{ inputs.tasks }})'
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: .vueform/*/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
