name: Task

# On-demand task runs (Actions → Task → Run workflow): one or more root gates
# or generators, space- or comma-separated (`check test`, `registry,size`).
# Each task runs as its own matrix job, so a single failed task can be
# re-run alone (Re-run failed jobs). The `build` job warms the vp task cache
# once and shares it run-scoped (keyed on the run id, so re-runs restore it);
# each task job's own `pnpm build` then replays from cache in seconds.
# Regenerated git-tracked artifacts (visual baselines, benchmark results,
# adapter registries, README size sections, docs content) are committed back
# to the dispatched branch; parallel jobs serialize their pushes with a
# rebase-and-retry loop over disjoint paths. Visual baselines: the first
# `test-visual` run on a runner OS has no `-linux` baselines, so it writes and
# commits them (next to the darwin ones, platform-suffixed) and later runs
# compare strictly; re-baseline deliberately with the `update_baselines`
# input.

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: >-
          Tasks: build check test test-dts test-smoke test-smoke-types
          test-visual registry size bench api docs:gen docs:build
        type: string
        required: true
        default: check
      update_baselines:
        description: 'test-visual: regenerate ALL baselines for this OS and commit them'
        type: boolean
        default: false

concurrency:
  group: task-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # the regenerated-artifacts commits

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      # `slug` is the task name made artifact-safe (`docs:gen` → `docs-gen`);
      # artifact names cannot contain `:`.
      - id: plan
        env:
          TASKS: ${{ inputs.tasks }}
        run: |
          echo "tasks=$(printf '%s\n' ${TASKS//,/ } | jq -R '{task: ., slug: (. | gsub(":"; "-"))}' | jq -sc 'unique')" >> "$GITHUB_OUTPUT"

  build:
    name: Warm build cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache vp tasks (run-scoped)
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite/task-cache
            packages/*/dist
          key: vp-tasks-${{ github.run_id }}

      - run: pnpm build

  task:
    name: ${{ matrix.task }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore vp tasks
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules/.vite/task-cache
            packages/*/dist
          key: vp-tasks-${{ github.run_id }}

      - name: Cache Playwright browsers
        if: contains(fromJSON('["test-smoke","test-visual","bench"]'), matrix.task)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        if: contains(fromJSON('["test-smoke","test-visual","bench"]'), matrix.task)
        run: pnpm exec playwright install --with-deps chromium

      # A replay of the warmed cache (seconds); gates and generators consume
      # the materialized dists.
      - name: Build workspace
        if: matrix.task != 'build'
        run: pnpm build

      # No `-linux` baselines committed yet → this run bootstraps and commits
      # them.
      - name: Detect missing Linux baselines
        id: baselines
        if: matrix.task == 'test-visual'
        run: |
          if find packages/*/tests/visual/screenshots -name '*-linux*' 2>/dev/null | grep -q .; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ${{ matrix.task }}
        env:
          UPDATE_BASELINES: ${{ (inputs.update_baselines || steps.baselines.outputs.missing == 'true') && 'true' || 'false' }}
        run: |
          if [ "${{ matrix.task }}" = "test-visual" ] && [ "$UPDATE_BASELINES" = "true" ]; then
            pnpm test-visual --update-snapshots
          else
            pnpm "${{ matrix.task }}"
          fi

      # Parallel task jobs may finish together; the rebase-and-retry loop
      # serializes their pushes (the staged paths are disjoint per task, so
      # the rebase never conflicts).
      - name: Commit regenerated artifacts
        run: |
          # `git add` fails on a pathspec that matches nothing (e.g. no
          # baselines generated on this run) — add each path on its own and
          # tolerate the misses.
          for p in \
            'packages/*/tests/visual/screenshots' \
            'packages/*/registry' \
            'packages/*/README.md' \
            'README.md' \
            'benchmark/results' \
            'docs/src'
          do
            git add -A -- "$p" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo 'No regenerated artifacts to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'chore(ci): regenerate artifacts (${{ matrix.task }})'
          for attempt in 1 2 3 4 5; do
            if git push origin 'HEAD:${{ github.ref_name }}'; then
              exit 0
            fi
            git pull --rebase origin '${{ github.ref_name }}'
          done
          echo 'Failed to push after 5 attempts.'
          exit 1

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.slug }}
          path: .vueform/*/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
