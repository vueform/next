packages:
  - packages/*
  - .playgrounds/*
  # Vapor playgrounds are standalone (own Vue 3.6 build, own lockfile),
  # installed with `pnpm install --ignore-workspace` by the pg scripts.
  - '!.playgrounds/*-vapor'
  - benchmark
  # The bench app pins its own Vue 3.6 (vapor) build — standalone install,
  # own lockfile, `pnpm install --ignore-workspace` by the bench runner.
  - '!benchmark/app'
  - docs

catalog:
  '@commitlint/cli': ^21.2.3
  '@commitlint/config-conventional': ^21.2.3
  '@nuxt/kit': ^3.17.5
  '@nuxt/module-builder': ^1.0.2
  '@nuxt/schema': ^3.17.5
  '@playwright/test': ^1.51.1
  '@primeuix/themes': ^2.0.3
  '@primevue/core': ^4.5.5
  '@tsconfig/node22': ^22.0.6
  '@types/hast': ^3.0.5
  '@types/node': ^24.13.6
  '@vitejs/plugin-vue': ^6.0.9
  '@vitest/browser': ^5.0.1
  '@vitest/browser-playwright': ^5.0.1
  '@vue/devtools-api': ^7.7.10
  '@vue/repl': ^4.7.2
  '@vue/shared': ^3.5.28
  '@vue/test-utils': ^2.4.6
  '@vue/tsconfig': 0.7.0
  ajv: ^8.20.0
  consola: ^3.4.2
  # eslint + its plugin stack removed entirely: oxlint owns linting
  # (.oxlintrc.json — correctness, import plugin, restricted imports,
  # unused vars) and oxfmt's sortImports owns import ordering. Dropped with
  # it: perfectionist/sort-modules (no oxlint equivalent, unenforced
  # convention now) and eslint-plugin-vue template rules (were never active:
  # flat/recommended is an array, `.rules` on it was always undefined).
  expr-eval-fork: ^3.0.3
  fast-glob: ^3.3.3
  happy-dom: ^20.14.5
  husky: ^9.1.7
  isomorphic-dompurify: ^3.19.0
  lint-staged: ^16.2.7
  nypm: ^0.6.10
  playwright: ^1.51.1
  oxfmt: ^0.70.0
  oxlint: ^1.85.0
  # prettier: ^3.9.8
  # prettier + prettier-plugin-jsdoc removed entirely: oxfmt is the repo
  # formatter AND the generators' embedded printer (oxfmt's format() API).
  # prettier-plugin-jsdoc: ^1.8.0
  # prettier-plugin-packagejson removed: oxfmt sortPackageJson owns package.json
  # prettier-plugin-packagejson: ^3.0.2
  primeicons: ^7.0.0
  primevue: ^4.5.5
  quill: ^2.0.3
  rollup-plugin-visualizer: ^7.1.1
  sass-embedded: ^1.104.1
  # Aligned with vitepress 2 alpha (bundles shiki 3.x) — a ^4 pin creates a
  # duplicate @shikijs/types instance and type clashes in config.mts.
  shiki: ^3.23.0
  stylelint: ^17.8.0
  stylelint-config-recess-order: ^7.7.0
  stylelint-config-standard-scss: ^17.0.0
  stylelint-order: ^8.1.1
  terser: ^5.51.2
  tsdown: ^0.23.0
  tsx: ^4.23.15
  typescript: ~5.9.3
  unplugin-vue: ^8.0.0
  vite: ^8.3.2
  # vite-plugin-dts removed: d.ts now emitted by vue-tsc + tsdown factories
  # vite-plugin-dts: ^4.5.4
  vite-plus: 1.0.0
  vitepress: ^2.0.0-alpha.16
  vitepress-plugin-group-icons: ^1.7.3
  vitest: 5.0.1
  vue: ^3.5.42
  vue-compiler-sfc-vapor: npm:@vue/compiler-sfc@3.6.0-rc.5
  vue-tsc: ^2.2.12
  vue-vapor: npm:vue@3.6.0-rc.5
  zod: ^4.6.5

catalogMode: strict

catalogs:
  peer:
    primevue: ^4.5.5
    vite: '>=5'
    vue: ^3.5.13
